<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameSinkid | สมัครสมาชิก</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<header class="navbar">
    <a href="index.html" class="brand"><span class="brand-icon">G</span><span>Game<span>Sinkid</span></span></a>
    <div class="nav-actions"><a href="login.html" class="btn btn-primary">เข้าสู่ระบบ</a></div>
</header>
<main class="login-layout">
    <section class="auth-card register-card">
        <div class="auth-title center"><span class="auth-logo">G</span><div><small>CREATE ACCOUNT</small><h2>สมัครสมาชิก</h2></div></div>
        <p class="auth-description">เลือกประเภทบัญชีที่เหมาะกับการใช้งานของคุณ</p>

        <form id="registerForm">
            <div class="role-choice">
                <label class="role-option">
                    <input type="radio" name="role" value="user" checked>
                    <span class="role-box"><strong>👤 ผู้ใช้ทั่วไป</strong><small>ค้นหาเกม ดูรายละเอียด และเก็บเกมที่ชอบ</small></span>
                </label>
                <label class="role-option">
                    <input type="radio" name="role" value="dev">
                    <span class="role-box"><strong>🧑‍💻 Developer</strong><small>ฝากเกม จัดการผลงาน และดูสถิติการเข้าชม</small></span>
                </label>
            </div>

            <div class="form-row">
                <div class="form-group"><label for="firstName">ชื่อ</label><input id="firstName" type="text" placeholder="ชื่อ" required></div>
                <div class="form-group"><label for="lastName">นามสกุล</label><input id="lastName" type="text" placeholder="นามสกุล" required></div>
            </div>
            <div class="form-group"><label for="username">ชื่อผู้ใช้</label><input id="username" type="text" placeholder="เช่น gamesinkid_user" required></div>
            <div class="form-group"><label for="email">อีเมล</label><input id="email" type="email" placeholder="example@email.com" required></div>
            <div class="form-row">
                <div class="form-group"><label for="password">รหัสผ่าน</label><input id="password" type="password" placeholder="อย่างน้อย 6 ตัว" minlength="6" required></div>
                <div class="form-group"><label for="confirmPassword">ยืนยันรหัสผ่าน</label><input id="confirmPassword" type="password" placeholder="กรอกรหัสอีกครั้ง" required></div>
            </div>
            <button type="submit" class="auth-submit">สมัครสมาชิก <span>→</span></button>
        </form>
        <p class="auth-switch">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
    </section>
</main>
<script src="script.js?v=2"></script>
</body>
</html>
